<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研助手 Agent</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1c2733; --muted: #6b7a8c;
    --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    --border: #e3e8ee; --mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--ink); }
  header { background: var(--card); border-bottom: 1px solid var(--border);
           padding: 14px 24px; display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .wrap { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px 24px;
          max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600;
             text-transform: uppercase; letter-spacing: .04em; }
  textarea, input[type=text] { width: 100%; border: 1px solid var(--border); border-radius: 8px;
         padding: 9px 11px; font: inherit; font-size: 14px; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid #bfdbfe; border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .row.grow > * { flex: 1; }
  label.chk { font-size: 13px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
  button { border: 0; border-radius: 8px; padding: 9px 18px; font: inherit; font-size: 14px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { background: #9db4d8; cursor: not-allowed; }
  button.ghost { background: #eef2f7; color: var(--ink); }
  .runs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .runs li { padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
             font-size: 13px; line-height: 1.45; }
  .runs li:hover { border-color: var(--accent); }
  .runs li.active { border-color: var(--accent); background: #eff6ff; }
  .runs .q { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .runs .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; justify-content: space-between; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .dot.running { background: var(--accent); animation: pulse 1.2s infinite; }
  .dot.done { background: var(--ok); }
  .dot.error { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 4px 0 12px; }
  .stat { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #eef2f7; }
  .chip.supported { background: #dcfce7; color: #14532d; }
  .chip.unsupported { background: #fee2e2; color: #7f1d1d; }
  .chip.conflicted { background: #fef3c7; color: #78350f; }
  .chip.metadata_error { background: #fce7f3; color: #831843; }
  .chip.pass { background: #dcfce7; color: #14532d; }
  .chip.fail { background: #fee2e2; color: #7f1d1d; }
  pre.log { background: #0f172a; color: #cbd5e1; font-family: var(--mono); font-size: 12px;
            border-radius: 8px; padding: 12px; max-height: 220px; overflow: auto; margin: 8px 0; }
  .trace { font-family: var(--mono); font-size: 12px; max-height: 300px; overflow: auto;
           border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .trace div { padding: 2px 0; border-bottom: 1px dashed #eef2f7; color: #475569; }
  .trace .ts { color: #94a3b8; margin-right: 6px; }
  .trace .who { color: var(--accent); margin-right: 6px; }
  .trace .err .who { color: var(--bad); }
  nav.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  nav.tabs button { background: #eef2f7; color: var(--ink); padding: 7px 14px; font-size: 13px; }
  nav.tabs button.active { background: var(--accent); color: #fff; }
  article.md { font-size: 15px; line-height: 1.75; }
  article.md h1 { font-size: 21px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  article.md h2 { font-size: 18px; margin-top: 26px; }
  article.md h3 { font-size: 16px; }
  article.md code { background: #f1f5f9; border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: 13px; }
  article.md pre { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; }
  article.md table { border-collapse: collapse; margin: 10px 0; font-size: 14px; }
  article.md th, article.md td { border: 1px solid var(--border); padding: 6px 10px; }
  article.md blockquote { border-left: 3px solid var(--accent); margin: 10px 0; padding: 2px 14px; color: var(--muted); }
  article.md a { color: var(--accent); }
  .flag { border-left: 3px solid var(--bad); background: #fef2f2; border-radius: 6px;
          padding: 8px 12px; margin: 6px 0; font-size: 13px; }
  .flag .st { color: var(--bad); font-weight: 600; margin-right: 6px; font-family: var(--mono); }
  .gap-item { border-left: 3px solid var(--warn); background: #fffbeb; border-radius: 6px;
              padding: 8px 12px; margin: 6px 0; font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; font-size: 14px; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #bfdbfe;
             border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 18px; }
  /* ---- 对话抽屉 ---- */
  .chat-fab { position: fixed; right: 22px; bottom: 22px; z-index: 50; border-radius: 999px;
              padding: 11px 20px; box-shadow: 0 4px 14px rgba(37,99,235,.35); font-size: 14px; }
  .drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(470px, 94vw); z-index: 60;
            background: var(--card); border-left: 1px solid var(--border);
            box-shadow: -8px 0 28px rgba(15,23,42,.12); display: flex; flex-direction: column;
            transform: translateX(105%); transition: transform .22s ease; }
  .drawer.open { transform: none; }
  .drawer .dhead { padding: 12px 14px; border-bottom: 1px solid var(--border);
                   display: flex; gap: 8px; align-items: center; }
  .drawer .dhead b { font-size: 14px; white-space: nowrap; }
  select { border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px; font: inherit;
           font-size: 12.5px; background: #fff; color: var(--ink); min-width: 0; }
  .drawer .dhead select { flex: 1; }
  .icon-btn { background: #eef2f7; color: var(--ink); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  #chat_web.on { background: var(--accent); color: #fff; }
  #chat_web:disabled { opacity: 0.4; cursor: not-allowed; }
  #chat_kb.on { background: var(--accent); color: #fff; }
  #chat_kb:disabled { opacity: 0.4; cursor: not-allowed; }
  .cite a { color: var(--accent); text-decoration: none; }
  .cite a:hover { text-decoration: underline; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 94%; padding: 9px 12px; border-radius: 12px; font-size: 14px; line-height: 1.65; }
  .msg.user { align-self: flex-end; background: #eff6ff; border: 1px solid #dbeafe; }
  .msg.assistant { align-self: flex-start; background: #f8fafc; border: 1px solid var(--border); }
  .msg.assistant.err { background: #fef2f2; border-color: #fecaca; color: var(--bad); }
  .msg p { margin: 0 0 6px; } .msg p:last-child { margin: 0; }
  .msg .cites { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .cite { font-size: 12px; color: var(--muted); background: #fff; border: 1px solid var(--border);
          border-radius: 6px; padding: 4px 8px; cursor: default; }
  .cite b { color: var(--accent); }
  .unverified { margin-top: 8px; border: 1px dashed #fca5a5; border-radius: 8px; padding: 6px 10px;
                font-size: 13px; background: #fffbeb; }
  .unverified summary { color: var(--warn); cursor: pointer; font-size: 12.5px; }
  .chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  .chat-input textarea { flex: 1; resize: none; min-height: 42px; max-height: 120px; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 4px 6px; }
</style>
</head>
<body>
<header>
  <h1>🔬 科研助手 Agent</h1>
  <span class="sub">文献调研 · 论文精读 · 证据可回溯综述</span>
</header>

<div class="wrap">
  <div style="display:flex; flex-direction:column; gap:16px;">
    <div class="card">
      <h2>新研究</h2>
      <textarea id="question" rows="3" placeholder="输入研究问题，如：VLM 后训练方法（SFT、DPO、GRPO）的对比与争议"></textarea>
      <div class="row">
        <input type="text" id="papers_dir" value="data/papers" placeholder="本地论文目录（可选）" style="flex:1">
      </div>
      <div class="row">
        <label class="chk"><input type="checkbox" id="no_download" checked> 只读本地 PDF</label>
        <label class="chk"><input type="checkbox" id="fake"> 离线演示（fake）</label>
      </div>
      <div class="row">
        <button id="btn_start" style="flex:1">开始研究</button>
      </div>
      <div class="row" id="start_hint" style="display:none; color:var(--muted); font-size:13px;"></div>
    </div>

    <div class="card" style="flex:1;">
      <h2>历史运行</h2>
      <ul class="runs" id="runs"><li class="empty">暂无</li></ul>
    </div>
  </div>

  <div class="card" id="detail" style="min-height: 70vh;">
    <div class="empty">← 选择一次运行，或发起新研究</div>
  </div>
</div>

<footer>报告引用格式 [n:页码] 可回溯到原文 PDF · 无证据结论会被四层核验拦截并如实标注</footer>

<button class="chat-fab" id="chat_fab">💬 对话 · 问答</button>
<div class="drawer" id="chat_drawer">
  <div class="dhead">
    <b>💬 对话</b>
    <select id="chat_ctx" title="问答语境"></select>
    <button class="icon-btn" id="chat_web" title="自由对话时联网搜索（需配置 ZHIPUAI_API_KEY）">🌐</button>
    <button class="icon-btn" id="chat_kb" title="自由对话时查知识库（历史 run 的证据全库检索，需 EMBEDDING_* 配置）">📚</button>
    <button class="icon-btn" id="chat_clear" title="清空当前对话">🗑</button>
    <button class="icon-btn" id="chat_close" title="收起">✕</button>
  </div>
  <div class="chat-msgs" id="chat_msgs"></div>
  <div class="chat-input">
    <textarea id="chat_text" rows="1" placeholder="输入消息（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="chat_send">发送</button>
  </div>
</div>

<script>
"use strict";
let current = null, pollTimer = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---- 极简 Markdown 渲染（报告子集：标题/粗斜体/代码/列表/表格/引用/链接/分隔线）----
function md2html(md) {
  const lines = String(md || "").split("\n");
  let out = [], i = 0, inCode = false, listType = null, para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const flushList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|\W)\*([^*]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  for (; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("```")) {
      flushPara(); flushList();
      if (!inCode) { out.push("<pre><code>"); inCode = true; } else { out.push("</code></pre>"); inCode = false; }
      continue;
    }
    if (inCode) { out.push(esc(line)); continue; }
    if (/^\s*$/.test(line)) { flushPara(); flushList(); continue; }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^(---|\*\*\*)\s*$/.test(line)) { flushPara(); flushList(); out.push("<hr>"); continue; }
    if (line.startsWith("> ")) { flushPara(); flushList(); out.push(`<blockquote>${inline(line.slice(2))}</blockquote>`); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {  // 表格（含分隔行）
      flushPara(); flushList();
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; }
      i--;
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      let html = "<table><thead><tr>" + cells(rows[0]).map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      for (let r = 2; r < rows.length; r++) html += "<tr>" + cells(rows[r]).map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>";
      out.push(html + "</tbody></table>"); continue;
    }
    const ul = line.match(/^\s*[-*]\s+(.*)/), ol = line.match(/^\s*\d+[.、]\s+(.*)/);
    if (ul || ol) {
      flushPara();
      const want = ul ? "ul" : "ol";
      if (listType !== want) { flushList(); out.push(`<${want}>`); listType = want; }
      out.push(`<li>${inline((ul || ol)[1])}</li>`); continue;
    }
    para.push(line);
  }
  if (inCode) out.push("</code></pre>");
  flushPara(); flushList();
  return out.join("\n");
}

// ---- API ----
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

// ---- 运行列表 ----
async function refreshRuns() {
  const { runs } = await api("/api/runs");
  $("runs").innerHTML = runs.length ? "" : '<li class="empty">暂无</li>';
  for (const r of runs) {
    const li = document.createElement("li");
    li.dataset.id = r.run_id;
    if (r.run_id === current) li.classList.add("active");
    li.innerHTML = `<span class="q">${esc(r.question || r.run_id)}</span>
      <span class="meta"><span><span class="dot ${r.status}"></span>${r.run_id}${r.fake ? " · fake" : ""}</span>
      <span>${esc((r.created_at || "").slice(5, 16))}</span></span>`;
    li.onclick = () => selectRun(r.run_id);
    $("runs").appendChild(li);
  }
  chatOptions(runs);
}

// ---- 详情渲染 ----
function statBox(v, label) { return `<div class="stat"><b>${esc(v ?? "-")}</b><span>${label}</span></div>`; }

async function selectRun(id, tab = "report") {
  current = id; clearInterval(pollTimer);
  document.querySelectorAll("#runs li").forEach((li) => li.classList.toggle("active", li.dataset.id === id));
  await renderDetail(id, tab);
  const s = await api(`/api/runs/${id}`).catch(() => null);
  if (s && s.status === "running") {
    pollTimer = setInterval(async () => {
      await renderDetail(id, tab);
      const st = await api(`/api/runs/${id}`).catch(() => null);
      if (!st || st.status !== "running") { clearInterval(pollTimer); refreshRuns(); }
    }, 3000);
  }
}

async function renderDetail(id, tab) {
  const s = await api(`/api/runs/${id}`).catch((e) => ({ error: e.message }));
  const box = $("detail");
  if (s.error && !s.run_id) { box.innerHTML = `<div class="empty">${esc(s.error)}</div>`; return; }

  const chips = Object.entries(s.claim_status || {}).map(([k, v]) =>
    `<span class="chip ${k}">${k} × ${v}</span>`).join("") || "";
  const ver = s.verification
    ? `<span class="chip ${s.verification.passed ? "pass" : "fail"}">核验 ${s.verification.passed ? "通过" : "未过"}</span>
       <span class="chip">缺引用句 ${s.verification.coverage_missing ?? "-"}</span>
       <span class="chip">冲突 ${s.verification.conflicts ?? "-"}</span>` : "";

  const head = `
    <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;">
      <b style="font-size:16px;">${esc(s.question || id)}</b>
      <span style="color:var(--muted); font-size:13px;">
        ${s.status === "running" ? '<span class="spinner"></span> ' : ""}${esc(s.phase || s.status)} · ${esc(s.created_at || "")}
      </span>
    </div>
    <div class="stats">
      ${statBox(s.papers, "论文")}${statBox(s.evidence, "证据")}${statBox(s.tasks, "任务")}
      ${statBox(s.research_round, "研究轮")}${statBox(s.repair_round, "修复轮")}${statBox(s.budget?.calls ?? "-", "LLM 调用")}
    </div>
    ${chips || ver ? `<div class="chips">${chips}${ver}</div>` : ""}
    ${s.error ? `<div class="flag"><span class="st">ERROR</span>${esc(s.error)}</div>` : ""}`;

  let body;
  if (s.status === "running") {
    body = `<pre class="log">${(s.log || []).map(esc).join("\n") || "启动中…"}</pre>
            <div class="trace" id="trace">${s.current_task ? "当前任务：" + esc(s.current_task) : ""}</div>`;
  } else {
    body = `
      <nav class="tabs">
        ${["report", "audit", "trace"].map((t) =>
          `<button class="${t === tab ? "active" : ""}" onclick="selectRun('${id}','${t}')">
            ${{report: "报告", audit: "审计", trace: "Trace"}[t]}</button>`).join("")}
      </nav>
      <div id="tabbody"><div class="empty">加载中…</div></div>`;
  }
  box.innerHTML = head + body;

  if (s.status === "running") {
    api(`/api/runs/${id}/trace?tail=30`).then(({ events }) => {
      const el = $("trace");
      if (el) el.innerHTML = events.map((e) =>
        `<div class="${e.kind.includes("error") ? "err" : ""}"><span class="ts">${e.ts}</span>` +
        `<span class="who">${esc(e.who || e.kind)}</span>${esc(e.detail)}</div>`).join("") || "";
    }).catch(() => {});
  } else {
    loadTab(id, tab);
  }
}

async function loadTab(id, tab) {
  const el = $("tabbody");
  if (tab === "report") {
    const { markdown } = await api(`/api/runs/${id}/report`).catch((e) => ({ markdown: `> ${e.message}` }));
    el.innerHTML = `<article class="md">${md2html(markdown)}</article>`;
  } else if (tab === "audit") {
    const a = await api(`/api/runs/${id}/audit`).catch((e) => null);
    if (!a) { el.innerHTML = `<div class="empty">审计包尚未生成</div>`; return; }
    el.innerHTML = `
      ${(a.gaps || []).length ? `<h3 style="font-size:14px;color:var(--muted)">证据缺口（如实披露）</h3>` +
        a.gaps.map((g) => `<div class="gap-item"><b>[${esc(g.severity)}]</b> ${esc(g.description)}</div>`).join("") : ""}
      ${(a.flagged || []).length ? `<h3 style="font-size:14px;color:var(--muted)">被拦截/存疑结论</h3>` +
        a.flagged.map((f) => `<div class="flag"><span class="st">${esc(f.status)}</span>${esc(f.claim)}
          ${f.note ? `<div style="color:var(--muted);margin-top:3px;">└ ${esc(f.note)}</div>` : ""}</div>`).join("") : ""}
      ${!(a.gaps || []).length && !(a.flagged || []).length ? `<div class="empty">全部结论通过核验</div>` : ""}`;
  } else {
    const { events } = await api(`/api/runs/${id}/trace?tail=200`);
    el.innerHTML = `<div class="trace" style="max-height:65vh">${events.map((e) =>
      `<div class="${e.kind.includes("error") ? "err" : ""}"><span class="ts">${e.ts}</span>` +
      `<span class="who">${esc(e.who || e.kind)}</span>${esc(e.detail)}</div>`).join("") || '<div class="empty">无事件</div>'}</div>`;
  }
}

// ---- 发起新研究 ----
$("btn_start").onclick = async () => {
  const question = $("question").value.trim();
  if (!question) { $("question").focus(); return; }
  $("btn_start").disabled = true;
  $("start_hint").style.display = "flex";
  $("start_hint").textContent = "提交中…";
  try {
    const { run_id } = await api("/api/research", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question, papers_dir: $("papers_dir").value.trim() || null,
        no_download: $("no_download").checked, fake: $("fake").checked,
      }),
    });
    $("start_hint").textContent = `已启动 ${run_id}（完整研究可能需要数十分钟，可关闭页面稍后回来查看）`;
    await refreshRuns();
    selectRun(run_id, "report");
  } catch (e) {
    $("start_hint").textContent = `✗ ${e.message}`;
  } finally { $("btn_start").disabled = false; }
};

// ---- 对话 / 证据问答 ----
let chatBusy = false;

function chatOptions(runs) {
  const sel = $("chat_ctx");
  const cur = sel.value;
  const done = (runs || []).filter((r) => r.status === "done");
  sel.innerHTML = '<option value="">自由对话（通用助手）</option>' + done.map((r) =>
    `<option value="${esc(r.run_id)}">证据问答：${esc((r.question || r.run_id).slice(0, 26))}${(r.question || "").length > 26 ? "…" : ""}</option>`).join("");
  if ([...sel.options].some((o) => o.value === cur)) sel.value = cur;
}

const chatStore = () => "ra_chat_" + ($("chat_ctx").value || "free");
const loadChat = () => { try { return JSON.parse(localStorage.getItem(chatStore())) || []; } catch { return []; } };
const saveChat = (msgs) => { try { localStorage.setItem(chatStore(), JSON.stringify(msgs)); } catch {} };

function renderChat(msgs) {
  const box = $("chat_msgs");
  box.innerHTML = "";
  for (const m of msgs) {
    const div = document.createElement("div");
    div.className = `msg ${m.role === "user" ? "user" : "assistant"}${m.error ? " err" : ""}`;
    const cites = (m.citations || []).map((c) => {
      // 证据问答：页码引用；联网问答：可点击链接（来源/日期）
      const label = c.page ? `第 ${c.page} 页` : [c.media, c.date].filter(Boolean).join("，");
      const body = c.url
        ? `<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">《${esc(c.title)}》↗</a>` +
          (label ? `（${esc(label)}）` : "")
        : `《${esc(c.title)}》${c.page ? `第 ${c.page} 页` : "页码未知"}`;
      return `<div class="cite" title="${esc(c.snippet || "")}"><b>[${c.n}]</b> ${body}</div>`;
    }).join("");
    const unverified = m.unverified
      ? `<details class="unverified"><summary>查看模型未验证的回答（无证据引用，勿直接采信）</summary>${md2html(m.unverified)}</details>` : "";
    div.innerHTML = (m.role === "user" ? `<p>${esc(m.content).replace(/\n/g, "<br>")}</p>` : md2html(m.content))
      + (cites ? `<div class="cites">${cites}</div>` : "") + unverified;
    box.appendChild(div);
  }
  box.scrollTop = box.scrollHeight;
}

async function sendChat() {
  if (chatBusy) return;
  const text = $("chat_text").value.trim();
  if (!text) return;
  const ctx = $("chat_ctx").value || null;
  const msgs = loadChat();
  msgs.push({ role: "user", content: text });
  saveChat(msgs);
  $("chat_text").value = "";
  renderChat(msgs);
  chatBusy = true;
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = '<span class="spinner"></span> 思考中…';
  $("chat_msgs").appendChild(typing);
  $("chat_send").disabled = true;
  try {
    const out = await api("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: msgs.filter((m) => !m.error).map(({ role, content }) => ({ role, content })),
        run_id: ctx,
        web_search: !ctx && webOn(),
        use_kb: !ctx && !webOn() && kbOn(),
      }),
    });
    msgs.push({ role: "assistant", content: out.reply, citations: out.citations, unverified: out.unverified || null });
  } catch (e) {
    msgs.push({ role: "assistant", content: `⚠ ${e.message}`, error: true });
  }
  saveChat(msgs);
  renderChat(msgs);
  chatBusy = false;
  $("chat_send").disabled = false;
}

$("chat_fab").onclick = () => {
  $("chat_drawer").classList.add("open");
  renderChat(loadChat());
  $("chat_text").focus();
};
$("chat_close").onclick = () => $("chat_drawer").classList.remove("open");
$("chat_clear").onclick = () => { localStorage.removeItem(chatStore()); renderChat([]); };

// 联网开关：仅自由对话生效（证据问答时置灰），状态持久化
const webOn = () => $("chat_web").classList.contains("on");
// 知识库开关：历史 run 证据的全库向量检索（联网开启时联网优先）
const kbOn = () => $("chat_kb").classList.contains("on");
function syncWebToggle() {
  const ctx = $("chat_ctx").value;
  $("chat_web").disabled = !!ctx;
  $("chat_web").title = ctx
    ? "证据问答模式下联网开关不生效（以 run 的证据库为准）"
    : "自由对话时联网搜索（需在 .env 配置 ZHIPUAI_API_KEY）";
  $("chat_kb").disabled = !!ctx;
  $("chat_kb").title = ctx
    ? "证据问答模式下知识库开关不生效（以 run 的证据库为准）"
    : "自由对话时查知识库（历史 run 证据全库检索，需 EMBEDDING_* 配置）";
}
try { if (localStorage.getItem("ra_websearch") === "1") $("chat_web").classList.add("on"); } catch {}
$("chat_web").onclick = () => {
  $("chat_web").classList.toggle("on");
  try { localStorage.setItem("ra_websearch", webOn() ? "1" : "0"); } catch {}
};
try { if (localStorage.getItem("ra_kbswitch") === "1") $("chat_kb").classList.add("on"); } catch {}
$("chat_kb").onclick = () => {
  $("chat_kb").classList.toggle("on");
  try { localStorage.setItem("ra_kbswitch", kbOn() ? "1" : "0"); } catch {}
};
$("chat_ctx").onchange = () => { syncWebToggle(); renderChat(loadChat()); };
syncWebToggle();
$("chat_send").onclick = sendChat;
$("chat_text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

refreshRuns();
setInterval(refreshRuns, 15000);
</script>
</body>
